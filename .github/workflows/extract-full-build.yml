name: Extract Full Build

on:
  push:
    paths:
      - '.github/workflows/extract-full-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archived build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted-full-build
          mkdir -p extracted-full-build
          unzip -q "market intelligence os full build.zip" -d extracted-full-build
          echo "--- SOURCE TREE ---"
          find extracted-full-build -maxdepth 5 -type f | sort | head -300
          echo "--- FRONTEND HITS ---"
          grep -R -n -E "OperatorConsole|console-shell|rail-brand" extracted-full-build | head -80 || true

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: extracted-market-intelligence-os
          path: extracted-full-build/
          if-no-files-found: error
          retention-days: 1
